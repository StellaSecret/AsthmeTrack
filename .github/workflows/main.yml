name: CI/CD AsthmeTrack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  security-events: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── PARALLEL SECURITY JOBS ────────────────────────────
  scan-secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - name: Perform Analysis
        uses: github/codeql-action/analyze@v3

  npm-security:
    name: NPM Audit & Placeholders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install & Audit
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Verify Placeholders
        run: |
          if grep -q "apps.googleusercontent.com" www/index.html || grep -q "apps.googleusercontent.com" capacitor.config.json; then
            echo "❌ Google Client ID en clair !" && exit 1
          fi

  # ── PARALLEL TEST JOB (Sharded) ──────────────────────
  playwright-tests:
    name: Playwright Tests (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - name: Upload report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.shardIndex }}
          path: playwright-report/
          retention-days: 30

  # ── PARALLEL MUTATION TEST JOB ────────────────────────
  mutation-tests:
    name: Mutation Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: logic-core
            files: www/app/logic.js
            exclude_lines: '7,8,9,10,11,12,13,46'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: "Run mutation tests (${{ matrix.name }})"
        id: mutants
        run: |
          set -o pipefail
          i=0
          fatal=0
          TIMEOUT="${{ matrix.timeout }}"
          if [ -z "$TIMEOUT" ]; then
            TIMEOUT=300
          fi
          for f in ${{ matrix.files }}; do
            echo "::group::$f"
            EXCLUDE_LINES="${{ matrix.exclude_lines }}"
            timeout "$TIMEOUT" npx stryker run --mutate "$f" --reporters json,progress,html && ec=0 || ec=$?
            if [ "$ec" -ne 0 ]; then
              echo "WARN: stryker exited $ec on $f (report may still be valid)"
            fi
            parse_args=(reports/mutation/mutation.json "work-$i/mutants.out")
            if [ -n "$EXCLUDE_LINES" ]; then
              parse_args+=(--exclude-lines "$EXCLUDE_LINES")
            fi
            node scripts/mutants-txt.mjs "${parse_args[@]}" && p=0 || p=$?
            rm -rf reports/mutation
            echo "::endgroup::"
            if [ "$p" -ne 0 ]; then
              echo "FATAL: mutants-txt exited $p on $f"
              fatal=$p
            else
              echo "mutants-txt exited $p on $f"
            fi
            i=$((i + 1))
          done
          mkdir -p mutants.out
          for d in work-*/mutants.out; do
            [ -f "$d/caught.txt" ] && cat "$d/caught.txt" >> mutants.out/caught.txt
            [ -f "$d/missed.txt" ] && cat "$d/missed.txt" >> mutants.out/missed.txt
            [ -f "$d/unviable.txt" ] && cat "$d/unviable.txt" >> mutants.out/unviable.txt
          done
          echo "Merged $(wc -l < mutants.out/caught.txt 2>/dev/null || echo 0) caught, $(wc -l < mutants.out/missed.txt 2>/dev/null || echo 0) missed, $(wc -l < mutants.out/unviable.txt 2>/dev/null || echo 0) unviable"
          echo "fatal=$fatal" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-${{ matrix.name }}
          path: mutants.out
          retention-days: 30
      - name: "Fail if mutations missed"
        if: steps.mutants.outputs.fatal != '0'
        run: |
          echo "mutation testing found missed/timeout mutants — exiting"
          exit ${{ steps.mutants.outputs.fatal }}

  mutation-summary:
    name: Mutation Tests Summary
    if: always()
    needs: [mutation-tests]
    runs-on: ubuntu-latest
    outputs:
      total_missed: ${{ steps.report.outputs.total_missed }}
    steps:
      - name: Download all mutant artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: mutants-*
          path: mutants/
          merge-multiple: false
      - name: Report results
        id: report
        run: |
          echo "## Mutation Testing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Shard | Caught | Missed | Unviable |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          total_caught=0
          total_missed=0
          total_unviable=0
          # A pattern matching a single artifact extracts directly into `path`,
          # while multiple matched artifacts get subdirectories named after the
          # artifact. Handle both layouts.
          while IFS= read -r caught_file; do
            dir=$(dirname "$caught_file")
            name=$(basename "$dir")
            if [ "$name" = "mutants" ]; then
              name="all"
            elif [[ "$name" == mutants-* ]]; then
              name="${name#mutants-}"
            fi
            caught=$(wc -l < "$caught_file")
            missed=0; unviable=0
            [ -f "$dir/missed.txt" ] && missed=$(wc -l < "$dir/missed.txt")
            [ -f "$dir/unviable.txt" ] && unviable=$(wc -l < "$dir/unviable.txt")
            total_caught=$((total_caught + caught))
            total_missed=$((total_missed + missed))
            total_unviable=$((total_unviable + unviable))
            if [ "$missed" -gt 0 ]; then
              echo "| $name | $caught | **$missed** | $unviable |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $name | $caught | $missed | $unviable |" >> $GITHUB_STEP_SUMMARY
            fi
          done < <(find mutants -name caught.txt 2>/dev/null | sort) || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total: $total_caught caught / $total_missed missed / $total_unviable unviable**" >> $GITHUB_STEP_SUMMARY
          echo "total_missed=$total_missed" >> $GITHUB_OUTPUT

  # ── SEQUENTIAL DEPLOYMENT JOBS ───────────────────────
  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: [playwright-tests]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Inject Client ID
        run: |
          sed -i "s|__GOOGLE_CLIENT_ID__|${{ secrets.GOOGLE_CLIENT_ID }}|g" www/app/app.js
          sed -i "s|__GOOGLE_CLIENT_ID__|${{ secrets.GOOGLE_CLIENT_ID }}|g" capacitor.config.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./www
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  build-android:
    name: Build Android
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: [scan-secrets, codeql-analysis, npm-security, playwright-tests, mutation-tests]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'build-review' || 'build' }}
    outputs:
      artifact-name: artifacts-${{ github.run_number }}
    env:
      # GitHub Actions does not expose repository secrets to workflow runs triggered
      # by Dependabot or by pull requests from forks. Trying to sign with an empty
      # KEYSTORE_BASE64 produces a 0-byte "keystore" and Gradle fails with a
      # confusing "Tag number over 30 is not supported" error. So on those runs we
      # skip signing entirely and build an unsigned debug APK/AAB just to confirm
      # the app still compiles.
      HAS_SIGNING_SECRETS: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install & Sync
        run: |
          npm ci
          sed -i "s|__GOOGLE_CLIENT_ID__|${{ secrets.GOOGLE_CLIENT_ID }}|g" www/app/app.js
          sed -i "s|__GOOGLE_CLIENT_ID__|${{ secrets.GOOGLE_CLIENT_ID }}|g" capacitor.config.json
          npx cap sync android

      - name: Decode keystore
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/asthmetrack-release.jks

      - name: Build signed Bundle & APK (release)
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: |
          cd android
          chmod +x gradlew
          VCODE=$((28 + ${{ github.run_number }}))
          sed -i "s/versionCode .*/versionCode $VCODE/" app/build.gradle
          ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/asthmetrack-release.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}" --no-daemon

      - name: Build unsigned Bundle & APK (no repo secrets on this run)
        if: env.HAS_SIGNING_SECRETS != 'true'
        run: |
          cd android
          chmod +x gradlew
          VCODE=$((28 + ${{ github.run_number }}))
          sed -i "s/versionCode .*/versionCode $VCODE/" app/build.gradle
          ./gradlew bundleDebug assembleDebug --no-daemon

      - name: Upload artifacts (signed release)
        if: env.HAS_SIGNING_SECRETS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Upload artifacts (unsigned debug — build validation only)
        if: env.HAS_SIGNING_SECRETS != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/debug/app-debug.aab
            android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  release:
    name: Create Release
    if: github.ref == 'refs/heads/main'
    needs: build-android
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-${{ github.run_number }}
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "AsthmeTrack v1.0.${{ github.run_number }}"
          files: dist/**/app-release.*
